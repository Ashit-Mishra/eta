spring:
  application:
    name: eta

  datasource:
    url: jdbc:postgresql://localhost:5432/railway_eta
    username: postgres
    password: 123Password@#
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info